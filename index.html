<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2747C9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="卡池拍賣">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>卡池拍賣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EBF2; --surface:#FFFFFF; --surface2:#F1F4F9; --ink:#19213A; --muted:#5A6378;
  --line:#D2D8E3; --accent:#2747C9; --accent-ink:#FFFFFF; --warn:#B3362B; --good:#1E7A4F; --bubble:#DCE4FF;
  --t-SS:#A37C0B; --t-S:#B02D6C; --t-A:#5A3FB5; --t-B:#2263AD; --t-C:#1D7C70; --t-D:#6A6F50; --t-E:#9B392F;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121625; --surface:#1C2133; --surface2:#161A29; --ink:#E7EBF4; --muted:#9BA4B9;
    --line:#333A51; --accent:#7D95FF; --accent-ink:#0E1430; --warn:#FF8A7E; --good:#6BD3A0; --bubble:#2A3360; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121625; --surface:#1C2133; --surface2:#161A29; --ink:#E7EBF4; --muted:#9BA4B9;
  --line:#333A51; --accent:#7D95FF; --accent-ink:#0E1430; --warn:#FF8A7E; --good:#6BD3A0; --bubble:#2A3360; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
#app{height:100%}
.scroll{height:100%;overflow-y:auto;padding:16px}
.num{font-family:"Chakra Petch","Noto Sans TC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.err{color:var(--warn);font-size:13px;min-height:1.2em}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.big{padding:13px 20px;font-size:17px;border-radius:12px}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--warn)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:16px}
label{display:block;font-weight:700;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.narrow{max-width:520px;margin:20px auto}
h2{font-size:17px;margin:0 0 12px;font-weight:900}
h3{font-size:15px;margin:18px 0 8px;font-weight:900}
.row{margin-bottom:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.or{text-align:center;color:var(--muted);margin:16px 0;font-size:13px}
.brand{font-weight:900;font-size:26px;text-align:center;margin:12px 0 4px}
.tagline{text-align:center;color:var(--muted);margin:0 0 18px;font-size:14px}
code{background:var(--surface2);padding:1px 6px;border-radius:6px}

/* ---------- theme extras ---------- */
body{background:radial-gradient(120% 60% at 15% -10%,color-mix(in srgb,var(--accent) 16%,var(--bg)),transparent 60%),radial-gradient(90% 50% at 110% 110%,color-mix(in srgb,#F2C94C 14%,var(--bg)),transparent 60%),var(--bg)}
.shell{background:transparent!important}
.logo{font-style:normal;display:inline-block;width:22px;height:22px;position:relative;margin-right:4px;vertical-align:-5px}
.logo::before,.logo::after{content:"";position:absolute;width:13px;height:18px;border-radius:3px;border:1.5px solid rgba(255,255,255,.8);top:2px}
.logo::before{left:1px;background:var(--t-S);transform:rotate(-12deg)}
.logo::after{left:8px;background:#D6AA28;transform:rotate(8deg)}
.av0{--pc:#E4572E}.av1{--pc:#2A9D8F}.av2{--pc:#8E5BD6}.av3{--pc:#E9A23B}.av4{--pc:#2F7FD1}.av5{--pc:#D6457D}
.ava{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pc);color:#fff;font-size:11px;font-weight:900;margin-right:5px;vertical-align:-4px;flex:0 0 auto}
.pt .pn{display:flex;align-items:center}
.pt{background:linear-gradient(180deg,color-mix(in srgb,var(--pc,var(--accent)) 9%,var(--surface)),var(--surface) 60%)}
.delta{position:absolute;right:8px;bottom:6px;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:14px;pointer-events:none;animation:dfloat 1.8s ease-out forwards}
.delta.up{color:var(--good)}.delta.down{color:var(--warn)}
@keyframes dfloat{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.strip.lit{border-color:color-mix(in srgb,var(--tcol) 55%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--tcol) 18%,var(--surface)),var(--surface) 65%);box-shadow:0 6px 18px -10px var(--tcol)}
.card.back{background:radial-gradient(circle at 50% 38%,#4C6BF0,#1C2C86 75%)!important;border:1.5px solid rgba(255,255,255,.55)!important;color:#fff!important;box-shadow:0 6px 14px -8px rgba(10,15,60,.7)!important}
.card.back::before{content:"?";font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:30px;line-height:1;opacity:.9}
.card.back .ct{font-size:10px!important;opacity:.85}
.msg .who b{color:var(--pc);font-weight:700}
.msg .who{display:flex;align-items:center}
.msg.mine .who{justify-content:flex-end}
.dock{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.feed{background:color-mix(in srgb,var(--surface2) 80%,transparent)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.cf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:cfall var(--t) var(--d) linear forwards;opacity:0}
@keyframes cfall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--x),110vh) rotate(var(--r))}}
.sndbtn{min-width:40px}
/* ---------- 抽卡舞台（咪牌） ---------- */
.stage{flex:0 0 auto;height:min(44%,330px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 0 10px;
  background:radial-gradient(60% 70% at 50% 55%,color-mix(in srgb,#7D95FF 22%,transparent),transparent 70%)}
.stage[hidden]{display:none}
.stg-lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.pullwrap{perspective:700px;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.pullcard{--p:0;--h:clamp(150px,28vh,230px);position:relative;flex:0 0 auto;height:var(--h);width:calc(var(--h) * 0.714);min-width:107px;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  transform:translateY(calc(var(--p) * -46px)) rotateX(calc(var(--p) * 24deg));transform-origin:50% 0%;transition:transform .35s cubic-bezier(.2,1.3,.4,1),box-shadow .35s;
  box-shadow:0 0 0 2px rgba(255,255,255,.6),0 14px 30px -14px rgba(10,15,60,.8),0 0 calc(var(--p) * 60px) calc(var(--p) * 12px) var(--tc)}
.pullcard.dragging{transition:none}
.pullcard:not(.peek){animation:breathe 1.6s ease-in-out infinite}
.pullcard.mine:not(.peek){cursor:pointer}
.pullcard.peek.mine{cursor:grab}
.pc-back{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(circle at 50% 38%,#4C6BF0,#1C2C86 75%);border-radius:16px}
.pc-back::before{content:"";position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:1.5px solid rgba(255,255,255,.45);border-radius:11px}
.pc-back::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 8px,transparent 8px 16px)}
.pc-back .q{font-family:"Chakra Petch",sans-serif;font-size:64px;font-weight:700;line-height:1;text-shadow:0 0 18px rgba(255,255,255,.5)}
.pc-back .pc-name{font-size:12px;font-weight:900;letter-spacing:.2em;opacity:.8;margin-top:6px}
.pc-leak{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p) * 100%);z-index:2;pointer-events:none;
  background:linear-gradient(to top,var(--tc) 0%,color-mix(in srgb,var(--tc) 70%,transparent) 35%,transparent 100%);opacity:min(1,calc(var(--p) * 1.4));box-shadow:inset 0 -2px 0 rgba(255,255,255,.8)}
.pc-leak::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#fff;opacity:.85;filter:blur(1px)}
.stg-hint{font-size:14px;font-weight:700}
.stg-hint .pct{font-family:"Chakra Petch",sans-serif;color:var(--accent);margin-left:4px}
@keyframes breathe{0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.6),0 14px 30px -14px rgba(10,15,60,.8),0 0 14px 2px rgba(125,149,255,.45)}50%{box-shadow:0 0 0 2px rgba(255,255,255,.8),0 14px 30px -14px rgba(10,15,60,.8),0 0 30px 8px rgba(125,149,255,.7)}}
/* ---------- 三選一 ---------- */
.deck{position:relative;width:calc(clamp(150px,28vh,230px) * 0.714 + 16px);height:calc(clamp(150px,28vh,230px) + 12px)}
.deck.mine{cursor:pointer}
.deck .pullcard{position:absolute;left:0;top:0;transition:none}
.deck .d3{transform:translate(12px,10px) rotate(6deg);opacity:.75;animation:none}
.deck .d2{transform:translate(6px,5px) rotate(3deg);opacity:.9;animation:none}
.deck .d1{transform:none}
.dealrow{flex:1 1 auto;min-height:0;display:flex;gap:8px;padding:0 8px;align-items:center;justify-content:center;width:100%}
.dealc{border:0;background:none;padding:0;font:inherit;color:inherit;border-radius:14px;animation:dealin .5s calc(var(--i) * .14s) cubic-bezier(.2,1.3,.4,1) both;transition:transform .15s}
.dealc.mine{cursor:pointer}
.dealc.mine:hover,.dealc.mine:focus-visible{transform:translateY(-8px) scale(1.04)}
.dealc:disabled{cursor:default;opacity:1}
.dealc .pullcard.dc{--h:clamp(100px,19vh,150px);min-width:0;animation:breathe 1.6s calc(var(--i) * .3s) ease-in-out infinite}
.dealc .pullcard.dc .q{font-size:42px}
.dealc .card.sm{width:calc(clamp(100px,19vh,150px) * 0.714);height:clamp(100px,19vh,150px)}
@keyframes dealin{from{transform:translateY(-90px) rotate(-12deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.ev.tier .pill{border-color:#D98A12;color:#9a5c00;font-weight:700;background:color-mix(in srgb,#F2C94C 16%,var(--surface))}
.tsrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tsp{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
.tsp.on{border-color:#D98A12;color:#9a5c00;font-weight:700}
.tline{font-size:13px;margin-bottom:4px}
/* ---------- 得標展示 ---------- */
.rv.wn .wcard{position:relative;animation:dropin .55s cubic-bezier(.2,1.4,.4,1) both}
.rv.wn .wcard .card{animation:none;box-shadow:0 0 0 3px rgba(255,255,255,.6),0 0 60px 10px var(--glow)}
.wstamp{position:absolute;right:-14px;top:38%;border:4px solid #ff5a4f;color:#ff5a4f;background:rgba(255,255,255,.92);font-weight:900;font-size:30px;padding:0 12px;border-radius:10px;
  transform:rotate(-14deg);animation:slam .4s .45s cubic-bezier(.2,1.6,.4,1) both;letter-spacing:.1em}
.wprice{position:relative;color:#7CFFB2;font-size:34px;font-weight:700;text-shadow:0 0 16px rgba(124,255,178,.6);animation:fadein .4s .7s both}
@keyframes dropin{from{transform:translateY(-60px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes slam{from{transform:rotate(-14deg) scale(3);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
/* ---------- 出價數字鍵盤 ---------- */
.bidin{cursor:pointer;font-weight:700}
.bidin.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.keypad .btn{padding:11px 0;font-size:18px;font-family:"Chakra Petch","Noto Sans TC",sans-serif}
.keypad .kpdone{grid-column:1/-1;font-family:inherit;font-size:16px}
/* ---------- 打字時收合 ---------- */
.shell.typing .pbar,.shell.typing .stage,.shell.typing .phr,.shell.typing .dk{display:none!important}
.shell.typing .strip{min-height:0;padding:5px 10px}
.shell.typing .strip .card.mini{display:none}
.shell.typing .strip .sb{font-size:18px}
.shell.typing .lobby-info{max-height:24%}
.shell.typing .endbox{max-height:22%}
/* ---------- 快捷語句 ---------- */
.phr .pe{padding:4px 8px}
.phlist{list-style:none;margin:0;padding:0}
.phlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
/* ---------- 羈絆標籤 ---------- */
.card .sbadge{position:absolute;top:4px;right:4px;z-index:3;max-width:64%;font-size:9px;font-weight:900;line-height:1.5;padding:0 5px;border-radius:6px;
  background:var(--sc);color:#fff;border:1px solid rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.card.hot{box-shadow:0 0 0 2px #F2C94C,0 0 14px 3px rgba(242,201,76,.75)!important}
.card.gone{filter:grayscale(1);opacity:.42}
.gi .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gi .o{float:none}
.gcards{display:flex;gap:10px;margin-top:6px}
.gc{display:flex;flex-direction:column;align-items:center;gap:3px}
.gc .gl{font-size:11px;color:var(--good);font-weight:700}
.gc.out .gl{color:var(--muted);font-weight:500}
/* ---------- 大廳 ---------- */
.lobby-info{padding:2px 12px 10px;overflow-y:auto;max-height:58%}
.lb-hero{position:relative;overflow:hidden;border-radius:20px;padding:14px 16px 14px;color:#fff;margin-bottom:10px;
  background:linear-gradient(135deg,#2747C9 0%,#5B3FD1 55%,#B02D6C 100%);box-shadow:0 12px 26px -16px rgba(39,71,201,.9)}
.lb-hero::before,.lb-hero::after{content:"";position:absolute;width:74px;height:104px;border-radius:12px;border:2px solid rgba(255,255,255,.35);right:-8px;top:-14px;transform:rotate(14deg);background:rgba(255,255,255,.08)}
.lb-hero::after{right:44px;top:22px;transform:rotate(-8deg);background:rgba(242,201,76,.25)}
.lb-hero .lbl{font-size:12px;opacity:.85;position:relative}
.lb-hero .code{font-family:"Chakra Petch",sans-serif;font-size:48px;font-weight:700;letter-spacing:.14em;line-height:1.05;position:relative;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.lb-hero .ttl2{font-size:26px;font-weight:900;position:relative;margin:2px 0}
.lb-hero .acts{display:flex;gap:8px;margin-top:10px;align-items:center;position:relative}
.lb-hero .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.lb-hero .btn:disabled{opacity:.4}
.lb-sub{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:2px 2px 6px}
.lb-sub .muted{font-weight:500}
.seats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.seat{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:9px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--pc,var(--accent)) 12%,var(--surface)),var(--surface) 70%);font:inherit;color:inherit}
.seat .big-ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pc,var(--accent));color:#fff;font-weight:900;font-size:16px;box-shadow:0 3px 8px -4px var(--pc,var(--accent))}
.seat .sn{font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .st{font-size:11px;color:var(--muted)}
.seat .crown{position:absolute;top:-10px;right:8px;font-size:17px}
.seat.off{opacity:.55}
.seat.empty{border-style:dashed;background:transparent;color:var(--muted)}
.seat.empty .big-ava{background:transparent;border:1.5px dashed var(--line);color:var(--muted);box-shadow:none}
.seat.add{cursor:pointer;border-color:var(--accent);color:var(--accent)}
.seat.add .big-ava{border-color:var(--accent);color:var(--accent)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
/* ---------- 姐妹丼挑卡 ---------- */
.modal.wide-m{max-width:440px;max-height:86vh;overflow-y:auto}
.pick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0 6px}
.pickc{border:0;background:none;padding:0;cursor:pointer;border-radius:12px;transition:transform .15s}
.pickc:hover,.pickc:focus-visible{transform:translateY(-4px) scale(1.04)}
.pickc .card{width:92px;height:128px}
.stealw{display:grid;gap:12px}
.stealp .sp-n{font-weight:900;font-size:14px;margin-bottom:4px}
.stealp .pick{justify-content:flex-start}
.stealp .pickc .card{width:70px;height:98px}
/* ---------- 億萬富翁 ---------- */
.eggfx{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 42%,#6b4a00,#1a1000 70%);animation:fadein .3s both,eshake .5s .2s}
.eggfx .rays{position:absolute;width:180vmax;height:180vmax;left:50%;top:42%;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(from 0deg,rgba(255,215,90,.38) 0 6deg,transparent 6deg 15deg);animation:spin 7s linear infinite}
.eggfx .crown,.eggfx .ttl,.eggfx .who,.eggfx .amt,.eggfx .sub{z-index:2}
.eggfx .crown{font-size:64px;position:relative;animation:reveal .8s .1s cubic-bezier(.2,1.4,.35,1) both}
.eggfx .ttl{position:relative;font-weight:900;font-size:clamp(46px,14vw,92px);line-height:1.05;letter-spacing:.06em;
  background:linear-gradient(100deg,#fff6c9 0%,#ffd34d 25%,#fff 45%,#e0a100 60%,#ffe58a 80%,#fff6c9 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #7a5200) drop-shadow(0 0 22px rgba(255,200,60,.7));animation:pop .6s .35s cubic-bezier(.2,1.6,.4,1) both,shine 2.2s 1s linear infinite}
.eggfx .who{position:relative;color:#fff;font-weight:900;font-size:20px;margin-top:10px;animation:fadein .5s .8s both}
.eggfx .amt{position:relative;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(34px,10vw,56px);color:#7CFFB2;text-shadow:0 0 18px rgba(124,255,178,.7);margin-top:6px;animation:pop .5s 1.1s cubic-bezier(.2,1.6,.4,1) both}
.eggfx .sub{position:relative;color:rgba(255,255,255,.7);font-size:13px;margin-top:14px;animation:fadein .5s 1.6s both}
.eggfx .bill{position:absolute;z-index:0;top:-60px;font-size:34px;font-style:normal;animation:billfall var(--t) var(--d) linear forwards;opacity:0}
@keyframes billfall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--x),115vh) rotate(var(--r))}}
@keyframes shine{to{background-position:-250% 0}}
@keyframes eshake{0%,100%{transform:none}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,2px)}}
.botctl{display:flex;align-items:center;gap:8px;margin:6px 0 8px;flex-wrap:wrap}
.botctl b{font-family:"Chakra Petch",sans-serif;font-size:20px;min-width:16px;text-align:center}
.practice-tag{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 12px;font-weight:900;font-size:14px}
/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:calc(var(--app-h,100vh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;background:var(--bg)}
.tb{display:flex;align-items:center;gap:6px;padding:8px 10px 6px}
.tb .room{font-size:13px;color:var(--muted);margin-right:auto}
.tb .room b{font-family:"Chakra Petch",sans-serif;font-size:19px;color:var(--ink);margin-left:4px;letter-spacing:.06em}
.pbar{display:flex;gap:6px;padding:2px 10px 8px;overflow-x:auto;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pt{flex:1 0 92px;max-width:180px;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 8px 7px;cursor:pointer;position:relative;min-width:0}
.pt.me{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pt.active{border-color:var(--accent);animation:glowp 1.4s ease-in-out infinite}
.pt.passed{opacity:.5}
.pt .pn{font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .pm{font-size:15px;font-weight:700;line-height:1.2}
.pt .ps{font-size:11px;color:var(--muted)}

.pt .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;min-height:7px}
.pt .dots i{width:7px;height:7px;border-radius:2px;display:block}
.pt .flag{position:absolute;top:-8px;right:6px;font-size:10px;font-weight:700;border-radius:999px;padding:0 6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);line-height:16px}
.pt .flag.hi{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pt .flag.off{color:var(--warn);border-color:var(--warn)}
.strip{display:flex;gap:10px;align-items:center;margin:0 10px 8px;padding:8px 10px 8px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);position:relative;min-height:90px}
.strip .si{flex:1;min-width:0}
.strip .sn{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sn small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.strip .sb{font-size:26px;font-weight:700;line-height:1.15;display:inline-block;transform-origin:left center}
.strip .sb small{font-size:12px;font-family:"Noto Sans TC",sans-serif;color:var(--muted);font-weight:500;margin-left:6px}
.strip .st{font-size:13px;color:var(--muted)}
.strip .st b{color:var(--accent)}
.strip .sr{font-size:11px;color:var(--muted);text-align:right;align-self:flex-start}
.strip .sr b{display:block;font-family:"Chakra Petch",sans-serif;font-size:18px;color:var(--ink)}
.sb.pulse{animation:pulse .55s ease-out}
.stamp{position:absolute;right:14px;top:50%;border:3px solid var(--warn);color:var(--warn);font-weight:900;font-size:20px;padding:0 10px;border-radius:8px;background:var(--surface);transform:translateY(-50%) rotate(-10deg);animation:stampin .45s cubic-bezier(.2,1.6,.4,1) both;text-align:center;line-height:1.3}
.stamp small{display:block;font-size:11px;font-weight:700}
.feed{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overscroll-behavior:contain}
.feed>li:first-child{margin-top:auto}
.msg{max-width:80%;align-self:flex-start}
.msg.mine{align-self:flex-end;text-align:right}
.msg .who{font-size:11px;color:var(--muted);display:block;margin:0 4px}
.msg .bub{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px;text-align:left;word-break:break-word}
.msg.mine .bub{background:var(--bubble);border-color:transparent}
.ev{align-self:center;max-width:94%;text-align:center}
.pill{display:inline-block;font-size:12px;padding:3px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);line-height:1.5}
.ev.bid .pill{color:var(--ink);font-weight:700}
.ev.win .pill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ev.syn .pill{border-color:var(--accent);color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.ev.draw .pill{color:#fff;border-color:transparent;font-weight:700}
.feed .empty{align-self:center;color:var(--muted);font-size:13px}
.dock{padding:8px 10px 10px;background:var(--surface)}
.dock.flash{animation:flash .9s ease-in-out 2}
.dk{margin-bottom:8px}
.dk:empty{display:none}
.dk-row{display:flex;gap:6px;align-items:center}
.bidin{flex:1;min-width:0;padding:10px;font-size:19px;text-align:right;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.dk .btn.step{padding:10px 12px;flex:0 0 auto}
.dk .go{flex:0 0 auto;padding:11px 14px}
.chipsrow{display:flex;gap:6px;overflow-x:auto;padding:6px 0 0;scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.chipsrow .btn{flex:0 0 auto;padding:5px 11px;font-size:13px}
.dk .note{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.dk .note b{color:var(--ink)}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
.inrow .btn{border-radius:999px}
.phr{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}
.phr::-webkit-scrollbar{display:none}
.phr .btn{flex:0 0 auto;padding:4px 10px;font-size:12px;font-weight:500;border-radius:999px}
.lobby-info{padding:0 12px 10px}
.lobby-info .code{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bigcode{font-family:"Chakra Petch",sans-serif;font-size:44px;font-weight:700;letter-spacing:.12em;line-height:1}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.pchip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.pchip.off{opacity:.55}
.endbox{padding:0 12px 10px;max-height:42%;overflow-y:auto}
.endbox .win{font-size:22px;font-weight:900;margin-bottom:6px}
.rk{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px}
.rk .r{font-family:"Chakra Petch",sans-serif;font-size:20px;font-weight:700;width:22px}
.rk .n{flex:1;font-weight:700;min-width:0}
.rk .n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.rk .s{font-family:"Chakra Petch",sans-serif;font-size:22px;font-weight:700}
.rk.top{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

/* ---------- cards ---------- */
.card{width:190px;height:262px;border-radius:18px;color:#fff;position:relative;padding:14px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;flex:0 0 auto;box-shadow:0 10px 24px -12px rgba(10,15,40,.55);background:var(--tcol)}
.card::after{content:"";position:absolute;inset:7px;border:1.5px solid rgba(255,255,255,.45);border-radius:12px;pointer-events:none}
.card .tier{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:40px;line-height:1;align-self:flex-start}
.card .nm{font-weight:900;font-size:26px;line-height:1.2;word-break:break-all}
.card .pts{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:17px}
.card .syn{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 9px;display:inline-block;margin:2px 0}
.card.has-art{background:var(--tcol) center/cover no-repeat;background-image:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.05) 55%),var(--art)}
.card.has-art .tier{background:var(--tcol);border-radius:8px;padding:3px 8px;font-size:22px}
.card.back{background:repeating-linear-gradient(135deg,var(--surface2) 0 9px,var(--surface) 9px 18px);color:var(--muted);border:1.5px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;text-align:center}
.card.back::after{display:none}
.card.big{width:min(230px,62vw);height:min(318px,86vw)}
.card.big .nm{font-size:30px}
.card.sm{width:76px;height:106px;border-radius:10px;padding:6px}
.card.sm::after{inset:3px;border-radius:7px;border-width:1px}
.card.sm .tier{font-size:16px}.card.sm.has-art .tier{font-size:12px;padding:1px 5px;border-radius:5px}
.card.sm .nm{font-size:13px}.card.sm .pts{font-size:11px}.card.sm .syn{display:none}
.card.mini{width:56px;height:78px;border-radius:9px;padding:5px;cursor:pointer}
.card.mini::after{inset:3px;border-radius:6px;border-width:1px}
.card.mini .tier{font-size:18px}.card.mini.has-art .tier{font-size:11px;padding:1px 5px;border-radius:5px}
.card.mini .foot{display:none}
.card.mini.back .ct{font-size:11px}
.tSS{--tcol:var(--t-SS)} .tS{--tcol:var(--t-S)} .tA{--tcol:var(--t-A)} .tB{--tcol:var(--t-B)} .tC{--tcol:var(--t-C)} .tD{--tcol:var(--t-D)} .tE{--tcol:var(--t-E)}
.card.tSS:not(.has-art){background:linear-gradient(155deg,#E2BC3A,var(--t-SS) 70%)}
.pill.tSS,.pill.tS,.pill.tA,.pill.tB,.pill.tC,.pill.tD,.pill.tE,.dots i.tSS,.dots i.tS,.dots i.tA,.dots i.tB,.dots i.tC,.dots i.tD,.dots i.tE{background:var(--tcol)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;justify-items:center}

/* ---------- overlays ---------- */
.ovl{position:fixed;inset:0;z-index:20;background:rgba(8,12,28,.55);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--panel,var(--surface));border-radius:18px;padding:22px;max-width:400px;width:100%;border:1px solid var(--line);animation:pop .4s cubic-bezier(.2,1.3,.4,1) both;position:relative;overflow:hidden}
.modal .k{font-size:13px;color:var(--muted)}
.modal .t{font-size:26px;font-weight:900;margin:2px 0 10px}
.modal p{margin:0 0 16px}
.modal .opts{display:grid;gap:8px}
.modal .mid{display:flex;justify-content:center;margin:4px 0 16px}
.modal.synm{border:2px solid var(--accent)}
.modal.synm::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,var(--accent) 30%,transparent) 80%,transparent 90%);animation:spin 3s linear infinite;z-index:0;pointer-events:none}
.modal.synm>*{position:relative;z-index:1}
.sheetw{position:fixed;inset:0;z-index:20;background:rgba(8,12,28,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel,var(--surface));width:100%;max-width:760px;max-height:88%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s ease-out both}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line);gap:8px}
.sh-h .ttl{font-weight:900;font-size:17px}
.sh-b{overflow-y:auto;padding:14px 18px 20px}
.tabs{display:flex;gap:6px;padding:10px 18px 0}
.tabs .btn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.pool div{border-radius:10px;color:#fff;padding:6px 8px;font-size:12px;background:var(--tcol)}
.pool b{display:block;font-family:"Chakra Petch",sans-serif;font-size:20px;line-height:1.2}
.gi{padding:9px 0;border-bottom:1px solid var(--line)}
.gi:last-child{border-bottom:0}
.gi .n{font-weight:900}
.gi .c{font-size:13px;color:var(--muted);margin-left:6px}
.gi .o{font-size:12px;font-weight:700;color:var(--good);float:right}
.gi .d{font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700}
.psum{display:flex;gap:18px;margin-bottom:12px;flex-wrap:wrap}
.psum div{font-size:12px;color:var(--muted)}
.psum b{display:block;font-family:"Chakra Petch",sans-serif;font-size:22px;color:var(--ink)}
.synb{display:inline-block;font-size:12px;font-weight:700;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:0 8px;margin:0 4px 4px 0}

/* reveal */
.rv{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--glow) 50%,#05081a),#05081a 72%);animation:fadein .25s both}
.rv .rays{position:absolute;width:170vmax;height:170vmax;left:50%;top:45%;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--glow) 40%,transparent) 0 7deg,transparent 7deg 18deg);animation:spin 10s linear infinite;opacity:.8}
.rv .card{animation:reveal .8s cubic-bezier(.2,1.35,.35,1) both;box-shadow:0 0 0 3px rgba(255,255,255,.55),0 0 70px 14px var(--glow)}
.rv .cap{color:#fff;margin-top:20px;font-weight:900;font-size:22px;animation:fadein .5s .45s both;position:relative}
.rv .sub{color:rgba(255,255,255,.72);font-size:13px;animation:fadein .5s .6s both;position:relative}
.rv.bad{background:radial-gradient(circle at 50% 45%,#3a2a2a,#0b0b10 72%)}
.rv.bad .card{animation:reveal .6s both,shake .5s .6s}
.rv .twist{position:relative;margin-top:12px;background:#fff;color:#19213A;border-radius:18px;padding:10px 18px;font-weight:900;font-size:18px;max-width:84vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:twist .55s 1.5s cubic-bezier(.2,1.6,.4,1) both}
.rv .twist::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
.rv.line .card{animation:reveal .8s cubic-bezier(.2,1.35,.35,1) both,shake .6s 1.35s}
.heart{position:absolute;bottom:-50px;font-size:30px;font-style:normal;opacity:0;animation:floatup 3.2s var(--d) ease-in forwards}
.cardsay .who{display:flex;align-items:center;gap:5px}
.cardsay .av{width:20px;height:20px;border-radius:50%;display:inline-block;background:var(--tcol) center/cover no-repeat;flex:0 0 auto}
.cardsay .bub{border-color:#F2C94C;background:color-mix(in srgb,#F2C94C 16%,var(--surface))}
.spark{position:absolute;left:50%;top:45%;width:9px;height:9px;border-radius:2px;background:var(--pc);opacity:0;animation:burst 1.3s var(--d) ease-out forwards}

@keyframes glowp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}}
@keyframes pulse{0%{transform:scale(1.3);color:var(--accent)}100%{transform:none}}
@keyframes stampin{from{transform:translateY(-50%) rotate(-10deg) scale(2.4);opacity:0}to{transform:translateY(-50%) rotate(-10deg) scale(1);opacity:1}}
@keyframes flash{0%,100%{background:var(--surface)}50%{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes reveal{0%{transform:perspective(800px) rotateY(180deg) scale(.3);opacity:0}60%{opacity:1}100%{transform:perspective(800px) rotateY(0) scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes twist{from{transform:scale(0) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes floatup{0%{opacity:0;transform:translateY(0)}12%{opacity:1}100%{opacity:0;transform:translateY(-115vh) rotate(var(--r))}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.pullcard{transition:none}.spark,.rv .rays,.heart,#fx,.delta,.eggfx .bill,.eggfx .rays{display:none}}

/* rules editor */
.cfg input,.cfg textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:15px}
.cfg input:disabled,.cfg textarea:disabled{opacity:.75}

.cfg .three label,.cfg .sp label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:2px}

.cfg .tr.h{font-size:12px;color:var(--muted);border-bottom:0;padding-bottom:0}
.cfg .tl{font-family:"Chakra Petch",sans-serif;font-weight:700;color:#fff;border-radius:8px;text-align:center;padding:7px 0;background:var(--tcol)}
.cfg textarea{resize:vertical;min-height:40px}
.cfg .sy{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cfg .sy.off{opacity:.55}
.cfg .syh{display:flex;gap:8px;align-items:center}
.cfg .syh input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
.cfg .syh input[type=text]{font-weight:900}
.cfg .sp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.cfg .sum{font-size:13px;margin-top:6px}
.warnbox{color:var(--warn);font-size:13px;margin:8px 0;padding-left:18px}
.artg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.artc{text-align:center;font-size:12px}

.artc .acts{display:flex;gap:4px;justify-content:center}

/* ================= 介面精緻化 ================= */
:root{--r-sm:10px;--r-md:14px;--r-lg:20px;
  --sh-sm:0 1px 2px rgba(16,24,64,.06),0 2px 8px -2px rgba(16,24,64,.10);
  --sh-md:0 10px 28px -14px rgba(16,24,64,.35),0 2px 6px -2px rgba(16,24,64,.08);
  --grad:linear-gradient(135deg,#3352E6 0%,#6A3FD6 100%);--grad-soft:linear-gradient(135deg,color-mix(in srgb,#3352E6 14%,var(--surface)),color-mix(in srgb,#6A3FD6 10%,var(--surface)))}
.btn{border-radius:12px;box-shadow:var(--sh-sm);transition:transform .12s,box-shadow .2s,border-color .2s,background .2s}
.btn:hover{box-shadow:var(--sh-md)}
.btn.ghost{box-shadow:none}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 18px -10px rgba(51,82,230,.9)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{box-shadow:none;filter:grayscale(.3)}
.field:focus,.inrow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);outline:none}
.panel{border-radius:var(--r-lg);box-shadow:var(--sh-md)}
.tb{position:relative;z-index:2;background:color-mix(in srgb,var(--surface) 62%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:8px 10px;margin-bottom:6px}
.tb .room b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pt{border-radius:var(--r-md);box-shadow:var(--sh-sm)}
.pt.active{border:2px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box}

let PRACTICE=false,botTimer=null,realUid=null;

function startPractice(name){

function botDriver(){

  const hs=Object.entries(room.players).filter(([u,p])=>!isBot(u)&&p.online).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
  return !!hs.length&&hs[0][0]===uid;
}
function onlineBots(){return Object.keys((room&&room.players)||{}).filter(isBot)}
async function addOnlineBot(){
  if(!room||!canHost()||(room.state||{}).phase!=='lobby')return;
  const ps=room.players||{}; if(Object.keys(ps).length>=6)return;
  const used=new Set(Object.values(ps).map(p=>p.name)); const i=BOTS.findIndex(b=>!used.has(b.name)); if(i<0)return;
  let k=0; while(ps['bot'+k])k++;
  try{await set(ref(db,'rooms/'+code+'/players/bot'+k),{name:BOTS[i].name,joinedAt:Date.now(),online:true,bot:true})}catch(e){UI.err='加入電腦失敗：'+e.message;render()}
}
async function removeOnlineBot(k){

function setBots(n){
  n=Math.max(1,Math.min(3,n)); local.bots=n; saveLocal();
  for(const k of Object.keys(room.players))if(isBot(k))delete room.players[k];

function scheduleBot(){
  clearTimeout(botTimer); if(!room||!room.state||!botDriver())return;
  const S=norm(clone(room.state));
  let who=null;
  if(S.phase==='draw')who=S.players[S.drawer];
  else if(S.phase==='choose'&&S.pending)who=S.players[S.pending.pi];
  else if((S.phase==='open'||S.phase==='bidding')&&S.actor!==null)who=S.players[S.actor];
  else if(S.phase==='deal')who=S.players[S.drawer];
  else if(S.phase==='kickask'&&S.kickAsk)who=S.players[S.kickAsk.pi];

  botTimer=setTimeout(botAct,700+rnd(800));
}
function synWorth(s,S,bi){
  switch(s.id){
    case 'pigs':return s.score+100;
    case 'ge':return ((geHasPts(s)?s.per:0)+(geHasCash(s)?s.cash/(RATE||400):0))*(S.players[bi].cards.filter(c=>['C','D'].includes(tierOf(c).k)).length+5);
    case 'sisters':return 45;
    case 'pay':return 30;
    case 'kick':return 50;
    default:return 40;
  }
}
const holderOf=(S,x)=>S.players.findIndex(q=>q.cards.includes(x));
/* 卡片對某位玩家的價值（以金額表示，不含個性與隨機）：卡片分數＋羈絆＋等級羈絆＋支線 */
function cardWorth(S,bi,c){
  const p=S.players[bi], t=tierOf(c); let pts=t.score;
  for(const s of SYN){
    if(!s.cards.includes(c))continue;
    const own=s.cards.filter(x=>x!==c).map(x=>holderOf(S,x)), w=synWorth(s,S,bi);
    if(own.every(o=>o===bi)){pts+=w;if(CFG.egg.on&&S.eggOwner===null&&synCountsEgg(s.id)&&eggCount(S,bi)===CFG.egg.need-1)pts+=500}
    else if(own.every(o=>o>=0&&o===own[0]))pts+=w*0.4;
    else if(own.every(o=>o===bi||o<0))pts+=w*0.25*(1+own.filter(o=>o===bi).length)/own.length;
  }
  {const kk=CFG.syn.kick; if(kk&&kk.on&&kk.partN>0&&kk.cards.includes(c)&&!S.kickGot['p'+bi+'a']&&kk.cards.filter(x=>x!==c&&p.cards.includes(x)).length+1===kk.partN)pts+=25*kk.partUses;}
  {const before=tierInfo(p).total; p.cards.push(c); const after=tierInfo(p).total; p.cards.pop(); pts+=after-before;}
  const bv=brValue(S,bi,c); pts+=bv.pts;
  const money=S.players.reduce((a,q)=>a+q.money,0);
  const rem=Math.max(1,S.pool.reduce((a,x)=>a+Math.max(0,tierOf(x).score),0)+Math.max(0,t.score));
  let rate=money/rem; if(RATE)rate=Math.min(rate,RATE*0.95);
  return {worth:pts*rate+bv.cash+xsValue(S,bi,c),rate};
}
/* 跨支線組合價值（金額）：自己差最後一張全額；有進度且沒被對手卡住時部分計入；對手差最後一張時阻擋 */
function xsValue(S,bi,c){
  let v=0;
  for(const x of xsOf(c)){
    const rest=x.cards.filter(y=>y!==c), hold=rest.map(y=>holderOf(S,y));
    if(!S.xsPaid['s'+x.i+'p'+bi]){
      if(hold.every(h=>h===bi))v+=x.val;
      else if(hold.every(h=>h===bi||h<0)&&hold.some(h=>h===bi))v+=x.val*0.3*hold.filter(h=>h===bi).length/rest.length;
    }
    if(hold.length&&hold.every(h=>h>=0&&h!==bi&&h===hold[0])&&!S.xsPaid['s'+x.i+'p'+hold[0]])v+=x.val*0.4;
  }
  return v;
}
function botValue(S,bi,c){
  const w=cardWorth(S,bi,c).worth; if(w<=0)return 0;
  const agg=(BOTS.find(x=>x.name===S.players[bi].name)||{agg:1}).agg;
  return Math.floor(w*agg*(0.8+Math.random()*0.4));
}
/* 電腦是否使用強制中離：挑「最想要這張卡」的對手，價值夠高（或接近遊戲尾聲）才用 */
function botKick(S){
  const pi=S.kickAsk.pi, c=S.card; let best=-1,bw=0,rate=1;
  S.players.forEach((q,qi)=>{if(!kickTargets(S,pi).includes(qi))return;const r=cardWorth(S,qi,c);rate=r.rate||rate;if(r.worth>bw){bw=r.worth;best=qi}});
  const need=rate*(S.pool.length<=6?30:70);
  return best>=0&&bw>=need?best:'no';
}
/* 支線價值：自己即將達到下一階時提高出價；對手即將達到下一階時出價阻擋。回傳 {pts,cash} */
function brValue(S,bi,c){
  const out={pts:0,cash:0}, me=S.players[bi], T=brTiers();
  const add=(t,f)=>{if(t.type==='money')out.cash+=t.val*f;else out.pts+=t.val*f};
  for(const b of brsOf(c)){
    const free=b.cards.filter(x=>x!==c&&holderOf(S,x)<0).length;
    const k=brCount(me,b), next=k+1;
    for(const t of T){
      const key='b'+b.i+'t'+t.ti+'p'+bi, done=t.type==='money'?S.brPaid[key]:k>=t.n;
      if(done)continue;
      if(t.n===next)add(t,1);
      else if(t.n>next&&next+free>=t.n)add(t,0.3*next/t.n);
    }
    S.players.forEach((q,qi)=>{
      if(qi===bi)return;
      const kq=brCount(q,b);
      for(const t of T){const key='b'+b.i+'t'+t.ti+'p'+qi;if(t.n===kq+1&&!(t.type==='money'?S.brPaid[key]:kq>=t.n))add(t,0.45)}
    });
  }
  return out;
}
function botAct(){
  if(!room||!botDriver())return;
  const ph=room.state&&room.state.phase;
  if(UI.busy||(ph!=='kickask'&&(UI.reveal||(UI.ovq&&UI.ovq.length)||UI.evQueue.length))||UI.confirmLeave){botTimer=setTimeout(botAct,UI.busy?250:600);return}
  tx(S=>{
    if(S.phase==='kickask'){if(!S.kickAsk||!isBot(S.players[S.kickAsk.pi].uid))return 'x';return gKick(S,botKick(S))}
    if(S.phase==='draw'){if(!isBot(S.players[S.drawer].uid))return 'x';return gDraw(S)}
    if(S.phase==='deal'){if(!isBot(S.players[S.drawer].uid))return 'x';return gPick(S,rnd(S.deal.length))}
    if(S.phase==='choose'){const pd=S.pending,pi=pd.pi;if(!isBot(S.players[pi].uid))return 'x';
      if((pd.type||'pay')==='pay')return gChoose(S,pd.opts.slice().sort((a,b)=>S.players[b].money-S.players[a].money)[0]);
      const val=o=>{const c=pd.type==='steal'?o.slice(o.indexOf('|')+1):o;return botValue(S,pi,c)+tierOf(c).score};
      return gChoose(S,pd.opts.slice().sort((a,b)=>val(b)-val(a))[0])}
    if(S.actor===null)return 'x';
    const b=S.players[S.actor]; if(!isBot(b.uid))return 'x';
    const m=minNext(S);
    if(S.phase==='open')return gBid(S,m);
    const v=botValue(S,S.actor,S.card);
    if(v>=m&&b.money>=m){
      let bid=m; const room2=Math.min(v,b.money)-m;
      if(room2>=CFG.step*3&&Math.random()<0.35)bid=m+Math.floor(Math.random()*Math.min(room2,CFG.step*30)/CFG.step)*CFG.step;
      return gBid(S,bid);
    }
    return gPass(S,false);
  },true);
}
function botChatOnWin(S,l){

}

/* ---------- 規則設定 ---------- */
function normCfg(c){
  const D=DEFAULT_CFG; if(!c)return clone(D);
  const o={startMoney:numOr(c.startMoney,D.startMoney),openBid:numOr(c.openBid,D.openBid),step:numOr(c.step,D.step),tiers:[],syn:{},linesText:typeof c.linesText==='string'?c.linesText:D.linesText};
  const ct=toArr(c.tiers);
  D.tiers.forEach((d,i)=>{const t=ct[i]||{};o.tiers.push({k:d.k,label:d.label,prob:numOr(t.prob,d.prob),score:numOr(t.score,d.score),cards:toArr(t.cards).map(String)})});
  for(const id of SYN_ORDER){
    const d=D.syn[id], s=(c.syn&&c.syn[id])||{}, x={...d};
    x.on=s.on===undefined?d.on:!!s.on; x.name=(s.name||d.name);
    const cs=s.cards===undefined?d.cards:toArr(s.cards); x.cards=d.cards.map((_,i)=>String(cs[i]??''));
    for(const [k] of SYN_PARAMS[id])x[k]=numOr(s[k],d[k]);
    if(id==='kick')x.egg=s.egg===undefined?d.egg:!!s.egg;
    if(id==='ge')x.type=['pts','money','both'].includes(s.type)?s.type:d.type;
    o.syn[id]=x;
  }
  const cm=c.money||{}, ce=c.egg||{};
  const parseNums=v=>(Array.isArray(v)?v:String(v??'').split(/[\/,，、\s]+/)).map(Number).filter(x=>Number.isFinite(x));
  o.tsyn=D.tsyn.map((d,i)=>{const t=toArr(c.tsyn)[i]||{};let th=parseNums(t.th===undefined?d.th:toArr(t.th)),bo=parseNums(t.bonus===undefined?d.bonus:toArr(t.bonus));
    const n=Math.min(th.length,bo.length);th=th.slice(0,n);bo=bo.slice(0,n);
    return {on:t.on===undefined?d.on:!!t.on,name:String(t.name||d.name),tier:d.tier,th,bonus:bo}});
  const cd=c.deal||{}; o.deal={on:cd.on===undefined?D.deal.on:!!cd.on,up:cd.up===undefined?D.deal.up:!!cd.up};
  o.money={mode:['auto','fixed','off'].includes(cm.mode)?cm.mode:D.money.mode,rate:numOr(cm.rate,D.money.rate)};
  o.egg={on:ce.on===undefined?D.egg.on:!!ce.on,name:String(ce.name||D.egg.name),need:Math.round(numOr(ce.need,D.egg.need)),money:numOr(ce.money,D.egg.money)};
  o.showVal=c.showVal===undefined?D.showVal:!!c.showVal;
  const cx=c.xset||{}, cxl=toArr(cx.list);
  o.xset={on:cx.on===undefined?D.xset.on:!!cx.on,list:D.xset.list.map((d,i)=>{const x=cxl[i]||{};return {on:x.on===undefined?d.on:!!x.on,name:String(x.name||d.name),cards:x.cards===undefined?d.cards.slice():toArr(x.cards).map(y=>String(y).trim()).filter(Boolean),val:numOr(x.val,d.val)}})};
  const cy=c.early||{};
  o.early={on:cy.on===undefined?D.early.on:!!cy.on,cards:cy.cards===undefined?D.early.cards.slice():toArr(cy.cards).map(x=>String(x).trim()).filter(Boolean),by:Math.max(0,Math.round(numOr(cy.by,D.early.by)))};
  const cb=c.br||{}, cl=toArr(cb.list), ctr=toArr(cb.tiers);
  o.br={on:cb.on===undefined?D.br.on:!!cb.on,egg:cb.egg===undefined?D.br.egg:!!cb.egg,
    tiers:D.br.tiers.map((d,i)=>{const t=ctr[i]||{};return {n:Math.max(0,Math.round(numOr(t.n,d.n))),type:['money','pts'].includes(t.type)?t.type:d.type,val:numOr(t.val,d.val)}}),
    list:D.br.list.map((d,i)=>{const b=cl[i]||{};return {on:b.on===undefined?d.on:!!b.on,name:String(b.name||d.name),cards:b.cards===undefined?d.cards.slice():toArr(b.cards).map(x=>String(x).trim()).filter(Boolean)}})};
  return o;
}
const totalPts=c=>c.tiers.reduce((a,t)=>a+t.score*t.cards.length,0);
function moneySetup(c,n){
  const tp=totalPts(c);
  if(c.money.mode==='off'||tp<=0||n<1)return {rate:0,start:c.startMoney};
  if(c.money.mode==='fixed'){const start=Math.max(c.openBid,Math.round(c.money.rate*tp/n/1000)*1000);return {rate:c.money.rate,start}}

}
let CFG,TIERS,SYN,TORDER,RATE=0;
function useCfg(c){

function synDesc(id,s){

function gBid(S,a){
  if(S.phase!=='open'&&S.phase!=='bidding')return '現在不能出價。';
  const p=S.players[S.actor], m=minNext(S);
  if(!Number.isInteger(a))return '請輸入整數金額。';
  if(a<m)return '最低需出價 '+fmt(m)+' 元。';
  if((a-m)%CFG.step!==0)return '加價單位是 '+fmt(CFG.step)+' 元。';
  if(a>p.money)return '資金不足，最多只能出 '+fmt(maxBid(S,p.money))+' 元。';
  S.bid=a; S.high=S.actor; log(S,p.name+' 出價 '+fmt(a),'bid');
  S.phase='bidding'; S.last=S.actor; advance(S); return null;
}
function gPass(S,forced){
  if(S.phase==='open'&&forced){S.passed.push(S.actor);log(S,S.players[S.actor].name+' 離線，跳過起標','sys');S.phase='bidding';S.last=S.actor;advance(S);return null}
  if(S.phase!=='bidding')return '現在不能 PASS。';
  S.passed.push(S.actor); log(S,S.players[S.actor].name+(forced?' 離線，由其他玩家代為 PASS':' PASS'),'pass');
  S.last=S.actor; advance(S); return null;
}
function advance(S){
  const n=S.players.length;
  for(let i=1;i<=n;i++){
    const idx=(S.last+i)%n;
    if(S.passed.includes(idx)||idx===S.high)continue;
    if(S.players[idx].money<minNext(S)){S.passed.push(idx);log(S,S.players[idx].name+' 資金不足 '+fmt(minNext(S))+'，被迫 PASS','sys');continue}
    S.actor=idx; return;
  }
  resolve(S);
}
function resolve(S){
  S.actor=null;
  if(S.high===null){log(S,'無人出價，「'+S.card+'」流標','sys');S.pendingNext=true;processQueue(S);return}
  const p=S.players[S.high], price=S.bid;
  p.money-=price; log(S,p.name+' 以 '+fmt(price)+' 得標「'+S.card+'」','win',{p:p.name,c:S.card,pr:price});
  {const ln=lineOf(S.card); if(ln)log(S,ln,'line',{c:S.card,p:p.name})}
  if(p.rebate){const r=Math.floor(price*CFG.syn.gamble.rebate/100);p.money+=r;p.rebate=false;log(S,p.name+' 博弈效果：返還 '+fmt(r)+' 元','syn')}
  p.cards.push(S.card); S.pendingNext=true; checkTier(S,S.high);
  checkSyn(S,S.high); processQueue(S);
}
function checkSyn(S,pi){
  const p=S.players[pi];

    if(S.synOwner[s.id]!==undefined)continue;
    if(s.cards.every(c=>p.cards.includes(c))){S.synOwner[s.id]=pi;S.queue.push({id:s.id,p:pi});log(S,p.name+' 湊齊羈絆「'+s.name+'」','synfx',{sid:s.id,p:p.name,cards:s.cards.slice()})}
  }
  checkKick(S);
  checkGe(S);
  checkBr(S);
  checkXset(S);
}
function checkArmed(S){
  const pi=S.armed.hui; if(pi===undefined||pi===null)return;
  const s=CFG.syn.hui, p=S.players[pi]; if(!s.on||!p)return;
  if(p.money<s.threshold&&others(S,pi).some(i=>S.players[i].money>p.money)){delete S.armed.hui;S.queue.push({id:'hui',p:pi,fire:true})}
}
function processQueue(S){
  if(S.pending)return;
  for(;;){
    checkArmed(S);
    if(!S.queue.length)break;
    const it=S.queue.shift(), r=applyEffect(S,it);
    if(r&&r.pending){S.pending=r.pending;S.phase='choose';return}
    if(r&&r.event)pushEvent(S,r.event);
    checkEgg(S);
  }
  checkEgg(S);
  if(S.pendingNext)nextTurn(S);
}
function checkEgg(S){
  const e=CFG.egg; if(!e.on||S.eggOwner!==null)return;
  for(let i=0;i<S.players.length;i++){
    const n=eggCount(S,i);
    if(n>=e.need){
      const p=S.players[i]; S.eggOwner=i; p.money+=e.money;
      log(S,p.name+' 集滿 '+n+' 個羈絆，觸發「'+e.name+'」！獲得 '+fmt(e.money)+' 元','egg',{p:p.name,n,m:e.money});
      return;
    }
  }
}
const others=(S,pi)=>S.players.map((p,i)=>i).filter(i=>i!==pi);
function applyEffect(S,it){
  const s=CFG.syn[it.id], p=S.players[it.p], P=S.players;
  const ev=text=>({event:{syn:s.name,owner:p.name,text}});
  if(!(it.id==='hui'&&!it.fire&&p.money>=s.threshold))log(S,p.name+(it.fire?' 的':' 發動')+'羈絆「'+s.name+'」'+(it.fire?'觸發':''),'syn');
  switch(it.id){
    case 'ge':return ev('之後每持有一張 C 或 D 卡，'+geRewardText(s)+'。');
    case 'pigs':return ev(s.cards.join('與')+'負負得正，兩張卡合計變為 '+s.score+' 分。');
    case 'glow':{
      const lines=others(S,it.p).map(i=>{const q=P[i],d=Math.min(s.amount,q.money);q.money-=d;return q.name+' 扣 '+fmt(d)+' 元'});
      log(S,s.name+'：'+lines.join('，'),'syn');
      return ev('其餘玩家各凹 30 支螢光棒：'+lines.join('，')+'。');
    }
    case 'pay':{
      const o=others(S,it.p);
      if(o.length===1)return {event:payTo(S,it.p,o[0])};
      return {pending:{type:'pay',pi:it.p,opts:o}};
    }
    case 'hui':{
      const o=others(S,it.p).sort((a,b)=>P[b].money-P[a].money)[0], q=P[o];
      if(p.money>=s.threshold||q.money<=p.money){
        S.armed.hui=it.p; log(S,p.name+' 集齊「'+s.name+'」，資金低於 '+fmt(s.threshold)+' 時自動觸發','syn');
        return ev(p.name+' 已集齊羈絆，目前條件未達成，效果先保留：之後只要資金低於 '+fmt(s.threshold)+' 元（且有人比他有錢），就會自動觸發。');
      }
      const tot=p.money+q.money; p.money=Math.ceil(tot/2); q.money=Math.floor(tot/2);
      log(S,s.name+'：'+p.name+' 與 '+q.name+' 平分資金','syn');
      return ev(p.name+' 與資金最高的 '+q.name+' 合計 '+fmt(tot)+' 元後平分，各得約 '+fmt(p.money)+' 元。');
    }
    case 'gamble':{
      const W=gambleOpts(s), tot=W.reduce((a,o)=>a+o.w,0); let r=Math.random()*tot, k=W.length-1;
      for(let i=0;i<W.length;i++){if(r<W[i].w){k=i;break}r-=W[i].w}
      let t;
      if(k===0){p.money+=s.m1;t=p.name+' 獲得 '+fmt(s.m1)+' 元。'}
      else if(k===1){p.scoreAdj+=s.s1;t=p.name+' 獲得 '+s.s1+' 分。'}
      else if(k===2){p.money+=s.m2;t=p.name+' 獲得 '+fmt(s.m2)+' 元。'}
      else if(k===3){p.scoreAdj+=s.s2;t=p.name+' 獲得 '+s.s2+' 分。'}
      else{p.rebate=true;t=p.name+' 下一次得標的卡片可返還 '+s.rebate+'% 金額。'}
      log(S,s.name+'結果 '+(k+1)+'：'+t,'syn');
      return ev('抽到效果 '+(k+1)+'：'+t);
    }
    case 'kick':return ev(p.name+' 集齊「'+s.name+'」，目前可用 '+kickLeftN(S,it.p)+' 次。之後每張卡翻開時會詢問是否使用，被指定的玩家這次競標會強制 PASS。');
    case 'sisters':{
      if(S.pool.length){
        const opts=[]; for(let i=0;i<3&&S.pool.length;i++){const c=drawFromPool(S);if(c)opts.push(c)}
        if(opts.length===1){const c=opts[0];giveCard(S,it.p,c);log(S,s.name+'：卡池只剩一張，'+p.name+' 直接獲得'+tierOf(c).label+'「'+c+'」','syn');return {event:{syn:s.name,owner:p.name,text:'卡池只剩最後一張，'+p.name+' 直接收下：',card:c}}}
        log(S,s.name+'：翻開 '+opts.join('、')+'，讓 '+p.name+' 挑一張','syn');
        return {pending:{type:'pick',pi:it.p,opts}};
      }
      const opts=[]; S.players.forEach((q,qi)=>{if(qi!==it.p)q.cards.forEach(c=>opts.push(qi+'|'+c))});
      if(!opts.length){log(S,s.name+'：卡池已空，其他人也沒有卡可搶','syn');return ev('卡池已空，其他玩家也沒有卡片可以搶，這次沒有效果。')}
      log(S,s.name+'：卡池已空，'+p.name+' 可以從其他玩家手上搶一張！','syn');
      return {pending:{type:'steal',pi:it.p,opts}};
    }
  }
  return null;
}
function payTo(S,pi,ti){
  const s=CFG.syn.pay, p=S.players[pi], q=S.players[ti], d=Math.min(s.amount,q.money);
  q.money-=d; p.money+=d; log(S,s.name+'：'+q.name+' 轉給 '+p.name+' '+fmt(d)+' 元','syn');
  return {syn:s.name,owner:p.name,text:q.name+' 轉給 '+p.name+' '+fmt(d)+' 元。'};
}
function giveCard(S,pi,c){
  const p=S.players[pi]; p.cards.push(c); checkTier(S,pi);
  const ln=lineOf(c); if(ln)log(S,ln,'line',{c,p:p.name});
  checkSyn(S,pi);
}
function gChoose(S,v){
  if(S.phase!=='choose'||!S.pending)return '現在不需要選擇。';
  const pd=S.pending, type=pd.type||'pay', pi=pd.pi, p=S.players[pi], sn=CFG.syn.sisters.name;
  if(type==='pay'){
    const ti=Number(v); if(!pd.opts.includes(ti))return '無效的選擇。';
    pushEvent(S,payTo(S,pi,ti));
  }else if(type==='pick'){
    if(!pd.opts.includes(v))return '無效的選擇。';
    S.pool.push(...pd.opts.filter(c=>c!==v));
    log(S,sn+'：'+p.name+' 挑走'+tierOf(v).label+'「'+v+'」','syn');
    pushEvent(S,{syn:sn,owner:p.name,text:p.name+' 從三張中挑走了：',card:v});
    S.pending=null; giveCard(S,pi,v);
  }else if(type==='steal'){
    if(!pd.opts.includes(v))return '無效的選擇。';
    const k=v.indexOf('|'), oi=Number(v.slice(0,k)), c=v.slice(k+1), q=S.players[oi];
    const at=q.cards.indexOf(c); if(at<0)return '這張卡已經不在對方手上。';
    q.cards.splice(at,1); {const lv={};tierInfo(q).list.forEach(t=>lv[t.tier]=t.lv);S.tierLv[oi]=lv}
    log(S,sn+'：'+p.name+' 從 '+q.name+' 手上搶走'+tierOf(c).label+'「'+c+'」！','syn');
    pushEvent(S,{syn:sn,owner:p.name,text:p.name+' 從 '+q.name+' 手上搶走了：',card:c});
    S.pending=null; giveCard(S,pi,c);
  }
  S.pending=null; S.phase='bidding';

}
function nextTurn(S){
  S.pendingNext=false; S.high=null; S.bid=0; S.passed=[]; S.actor=null; S.kicked=[]; S.kickAsk=null;
  if(!S.pool.length){S.phase='end';S.card=null;log(S,'卡池已空，遊戲結束','sys')}
  else{S.drawer=(S.drawer+1)%S.players.length;S.phase='draw'}
}
function tierInfo(p){
  const out=[]; let total=0;
  for(const t of CFG.tsyn){
    if(!t.on||!t.th.length)continue;
    const n=p.cards.filter(c=>tierOf(c).k===t.tier).length;
    let lv=-1; t.th.forEach((x,i)=>{if(n>=x)lv=i});
    const b=lv>=0?t.bonus[lv]:0; total+=b;
    out.push({name:t.name,tier:t.tier,n,lv,bonus:b,next:lv+1<t.th.length?t.th[lv+1]:null,th:t.th,all:t.bonus});
  }
  return {total,list:out};
}
function checkTier(S,pi){
  const p=S.players[pi]; if(!p)return;
  const cur=S.tierLv[pi]||{}, nx={};
  for(const t of tierInfo(p).list){
    nx[t.tier]=t.lv;
    if(t.lv>(cur[t.tier]??-1)&&t.lv>=0)log(S,p.name+' 持有 '+t.n+' 張 '+t.tier+' 卡，「'+t.name+'」升到第 '+(t.lv+1)+' 階：總共 +'+t.bonus+' 分','tier',{p:p.name});
  }
  S.tierLv[pi]=nx;
}
function scoreOf(p){
  const has=c=>p.cards.includes(c), pg=CFG.syn.pigs, gs=CFG.syn.ge;
  const pigs=pg.on&&pg.cards.every(has);
  let base=pigs?pg.score:0; for(const c of p.cards)if(!(pigs&&pg.cards.includes(c)))base+=tierOf(c).score;
  const ge=(gs.on&&geHasPts(gs)&&gs.cards.every(has))?gs.per*p.cards.filter(c=>['C','D'].includes(tierOf(c).k)).length:0;
  const money=RATE>0?Math.floor(Math.max(0,p.money)/RATE):0, tier=tierInfo(p).total, br=brBonus(p);
  return {base,ge,adj:p.scoreAdj,money,tier,br,total:base+ge+tier+p.scoreAdj+br+money};
}

/* ---------- 美術圖 ---------- */
async function makeArt(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const W=300,H=420,cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d'), s=Math.max(W/img.width,H/img.height), w=img.width*s, h=img.height*s;
    ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    let d=cv.toDataURL('image/webp',0.8);
    if(!d.startsWith('data:image/webp'))d=cv.toDataURL('image/jpeg',0.8);
    if(d.length>140000)d=cv.toDataURL('image/jpeg',0.6);
    return d;
  }finally{URL.revokeObjectURL(url)}
}

/* 這張卡對某位玩家的用途：湊齊羈絆、支線達到下一階、等級羈絆升階，方便判斷要讓誰中離 */
function kickHints(S,qi,c){
  const q=S.players[qi], out=[];
  for(const s of SYN)if(s.cards.includes(c)&&s.cards.filter(x=>x!==c).every(x=>q.cards.includes(x)))out.push('湊齊「'+s.name+'」');
  for(const b of brsOf(c)){const k=brCount(q,b), t=brTiers().find(t=>t.n===k+1);if(t)out.push('「'+b.name+'」達 '+t.n+' 張（'+(t.type==='money'?'$'+fmt(t.val):'+'+t.val+' 分')+'）')}
  for(const x of xsOf(c))if(!S.xsPaid['s'+x.i+'p'+qi]&&x.cards.filter(y=>y!==c).every(y=>q.cards.includes(y)))out.push('湊齊「'+x.name+'」（$'+fmt(x.val)+'）');
  {const before=tierInfo(q).total; q.cards.push(c); const after=tierInfo(q).total; q.cards.pop(); if(after>before)out.push('等級羈絆 +'+(after-before)+' 分')}
  {const kk=CFG.syn.kick; if(kk&&kk.on&&kk.cards.includes(c)){const m=kk.cards.filter(x=>x!==c&&q.cards.includes(x)).length+1;if((kk.partN>0&&m===kk.partN&&!S.kickGot['p'+qi+'a'])||(m===kk.cards.length&&!S.kickGot['p'+qi+'b']))out.push('獲得「'+kk.name+'」次數')}}
  return out;
}

/* 倒數只更新數字，不重畫視窗，避免按鈕被替換而點不到 */
function kickPaint(){const st=room&&room.state;if(!st||st.phase!=='kickask'||!st.kickAsk)return;const left=Math.max(0,Math.ceil((st.kickAsk.until-NOW())/1000));document.querySelectorAll('.kicksec').forEach(e=>{if(e.textContent!==String(left))e.textContent=left})}
function kickTick(){
  const st=room&&room.state; if(!st||st.phase!=='kickask'||!st.kickAsk){clearInterval(UI.kickIv);UI.kickIv=null;return}
  kickPaint();
  if(NOW()>=st.kickAsk.until&&!UI.busy&&Date.now()-(UI.kickTry||0)>2000){
    UI.kickTry=Date.now();
    tx(S=>S.phase==='kickask'&&S.kickAsk&&NOW()>=S.kickAsk.until-150?gKick(S,'no'):'',true);
  }
}

/* ===================== 操作 ===================== */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b||!CONFIG_OK)return;
  const v=b.dataset.v, act=b.dataset.act;
  if(act==='sheet-bg'&&e.target!==b)return;
  switch(act){
    case 'practice':{
      const name=(document.getElementById('nm').value||'').trim();
      if(!name){UI.homeErr='請先輸入暱稱。';return render()}
      UI.homeErr=''; startPractice(name); break;
    }
    case 'addbot':addOnlineBot();break;
    case 'rmbot':removeOnlineBot(v);break;
    case 'bots':if(PRACTICE&&room.state.phase==='lobby'){setBots((local.bots||2)+Number(v));onRoomUpdate()}break;
    case 'share':{const link=location.origin+location.pathname+'?room='+code+'&openExternalBrowser=1';
      if(navigator.share){try{await navigator.share({title:'卡池拍賣',text:'來玩卡池拍賣！房號 '+code,url:link})}catch(err){}}
      else{try{await navigator.clipboard.writeText(link);UI.copied=true;render();setTimeout(()=>{UI.copied=false;render()},2000)}catch(err){prompt('複製這個連結：',link)}}
      break}
    case 'create':case 'join':{
      const name=(document.getElementById('nm').value||'').trim();
      if(!name){UI.homeErr='請先輸入暱稱。';return render()}
      if(!uid){UI.homeErr='尚在連線，請稍候再試。';return render()}
      UI.homeErr='';
      if(act==='create')createRoom(name);
      else{const c=(document.getElementById('rc').value||'').replace(/\D/g,'');if(c.length!==4){UI.homeErr='請輸入 4 位數房號。';return render()}joinRoom(c,name)}
      break;
    }
    case 'copy':{const link=location.origin+location.pathname+'?room='+code+'&openExternalBrowser=1';try{await navigator.clipboard.writeText(link);UI.copied=true}catch(err){prompt('複製這個連結：',link)}render();setTimeout(()=>{UI.copied=false;render()},2000);break}
    case 'rules':UI.sheet={type:'rules'};if(!unsubArt&&uid)subArt();render();break;
    case 'info':UI.sheet={type:'info'};render();break;
    case 'tab':UI.infoTab=v;render();break;
    case 'pinfo':UI.sheet={type:'player',v:+v};render();break;
    case 'zoom':UI.sheet={type:'zoom',v};render();break;
    case 'sheet-close':case 'sheet-bg':UI.sheet=null;render();break;
    case 'reveal-close':if(canCloseFx())nextOverlay();break;
    case 'kick-fold':{const st=room&&room.state;if(st&&st.kickAsk){UI.kickFold=st.kickAsk.until;render()}break}
    case 'kick-open':UI.kickFold=null;UI.sheet=null;render();break;
    case 'kick':{const kv=v;tx(S=>(S.phase!=='kickask'||!S.kickAsk||myIdx(S)!==S.kickAsk.pi)?'無法選擇。':gKick(S,kv==='no'?'no':Number(kv)));break}
    case 'snd':local.sound=!soundOn();saveLocal();if(soundOn()){ac();play('turn')}lastOv='';render();break;
    case 'sound':UI.sheet={type:'sound'};render();break;
    case 'mus':{local.music=!musicOn();saveLocal();const a=ac();if(a&&a.state!=='running')a.resume().then(musicSync).catch(()=>{});else musicSync();lastOv='';render();break}
    case 'cfg-reset':if(canHost())saveCfg(clone(DEFAULT_CFG));break;
    case 'art-pick':UI.artTarget=v;document.getElementById('artFile').click();break;
    case 'art-del':try{await set(ref(db,'art/'+artKey(v)),null)}catch(err){UI.artErr='移除失敗：'+err.message;render()}break;
    case 'start':{
      const ps=Object.entries(room.players||{}).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0)).map(([u,p])=>({uid:u,name:p.name}));
      UI.sheet=null;
      tx(S=>{if(S.phase!=='lobby')return '遊戲已經開始。';if(ps.length<2)return '至少需要 2 位玩家。';
        const c=normCfg(S.cfg), er=validateCfg(c); if(er.length)return er[0];
        Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,newGame(ps,c));return null});
      break;
    }
    case 'draw':if(UI.reveal)break;tx(S=>myIdx(S)!==S.drawer?'還沒輪到你。':gDraw(S,true));break;
    case 'pick':{const pi=+v;tx(S=>myIdx(S)!==S.drawer?'還沒輪到你。':gPick(S,pi));break}
    case 'reveal':tx(S=>myIdx(S)!==S.drawer?'還沒輪到你。':gReveal(S));break;
    case 'keypad':UI.keypad=!UI.keypad;UI.kstr='';render();break;
    case 'kp':{let k=UI.kstr||'';if(v==='⌫')k=k.slice(0,-1);else if(k.length<9)k=(k+v).replace(/^0+/,'');UI.kstr=k;UI.input=parseInt(k,10)||0;UI.err='';render();break}
    case 'phrases-edit':UI.sheet={type:'phrases'};render();break;
    case 'ph-add':{const i=document.getElementById('phNew');const t=(i&&i.value||'').trim().slice(0,20);if(!t)break;const a=myPhrases().slice();if(a.length>=20)break;a.push(t);local.phrases=a;saveLocal();i.value='';renderPhrases();lastOv='';render();break}
    case 'ph-del':{const a=myPhrases().slice();a.splice(+v,1);local.phrases=a.length?a:['…'];saveLocal();renderPhrases();lastOv='';render();break}
    case 'ph-reset':local.phrases=null;saveLocal();renderPhrases();lastOv='';render();break;
    case 'adj':{UI.kstr='';const S=norm(clone(room.state)),a=S.players[S.actor];if(!a)break;let x=(Number(UI.input)||0)+Number(v);x=Math.max(minNext(S),Math.min(x,maxBid(S,a.money)||minNext(S)));UI.input=x;UI.err='';render();break}
    case 'setmin':{const S=norm(clone(room.state));UI.input=minNext(S);UI.err='';render();break}
    case 'setmax':{const S=norm(clone(room.state)),a=S.players[S.actor];if(!a)break;UI.input=maxBid(S,a.money)||minNext(S);UI.err='';render();break}
    case 'bid':{const amt=Number(UI.input);tx(S=>myIdx(S)!==S.actor?'還沒輪到你。':gBid(S,amt));break}
    case 'pass':tx(S=>myIdx(S)!==S.actor?'還沒輪到你。':gPass(S,false));break;
    case 'skip':tx(S=>{
      if(S.phase==='draw'){if(isOnline(S.players[S.drawer].uid))return '對方已上線。';log(S,S.players[S.drawer].name+' 離線，由其他玩家代為抽卡','sys');return gDraw(S)}
      if(S.phase==='peek'){if(isOnline(S.players[S.drawer].uid))return '對方已上線。';return gReveal(S)}
      if(S.phase==='deal'){if(isOnline(S.players[S.drawer].uid))return '對方已上線。';return gPick(S,rnd(S.deal.length))}
      if(S.phase==='choose'){const pi=S.pending.pi;if(isOnline(S.players[pi].uid))return '對方已上線。';return gChoose(S,S.pending.opts[rnd(S.pending.opts.length)])}
      if(S.actor===null||isOnline(S.players[S.actor].uid))return '對方已上線。';
      return gPass(S,true);
    });break;
    case 'choose':{const cv=v;tx(S=>(!S.pending||myIdx(S)!==S.pending.pi)?'無法選擇。':gChoose(S,cv));break}
    case 'ev-ok':UI.evQueue.shift();render();break;
    case 'again':{const st=norm(clone(room.state));const ps=st.players.map(p=>({uid:p.uid,name:p.name}));
      tx(S=>{if(S.phase!=='end')return '遊戲尚未結束。';const c=normCfg(S.cfg);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,newGame(ps,c));return null});break}
    case 'tolobby':tx(S=>{const c=normCfg(S.cfg);Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,{phase:'lobby',cfg:c});return null});break;
    case 'send':{const i=document.getElementById('chatIn');sendChat(i.value);i.value='';i.blur();break}
    case 'phrase':sendChat(v);break;
    case 'leave':
      if(room&&room.state&&room.state.phase!=='lobby'&&room.state.phase!=='end'){UI.confirmLeave=true;render()}else leaveRoom();break;
    case 'leave-yes':UI.confirmLeave=false;leaveRoom();break;
    case 'leave-no':UI.confirmLeave=false;render();break;
  }
});
document.getElementById('artFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0], name=UI.artTarget; e.target.value='';
  if(!f||!name)return;
  UI.artBusy='處理「'+name+'」的圖片中…'; UI.artErr=''; render();
  try{const d=await makeArt(f);await set(ref(db,'art/'+artKey(name)),d);if(!unsubArt)subArt()}
  catch(err){UI.artErr='上傳失敗：'+(err&&err.message||'無法讀取這張圖片')+'。若是權限問題，請確認 Firebase 規則已加入 art。'}
  UI.artBusy=''; render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='musVol'){local.musicVol=Number(t.value)/100;saveLocal();musApply();return}
  if(t.id==='bidAmt'){UI.input=parseInt(t.value,10)||0}
  else if(t.id==='nm'){local.name=t.value;saveLocal()}
});
document.addEventListener('change',e=>{
  if(e.target.id&&e.target.id.startsWith('cfg-')&&room&&room.state&&room.state.phase==='lobby'&&canHost())saveCfg(readCfgForm());
});
document.addEventListener('focusin',e=>{if(e.target.id==='chatIn'){const sh=document.querySelector('.shell');if(sh)sh.classList.add('typing');if(UI.keypad){UI.keypad=false;render()}applyPassive(curS())}});
document.addEventListener('focusout',e=>{if(e.target.id==='chatIn'){const sh=document.querySelector('.shell');setTimeout(()=>{if(document.activeElement!==document.getElementById('chatIn')&&sh)sh.classList.remove('typing');applyPassive(curS())},50)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(UI.sheet||UI.reveal)){UI.sheet=null;if(UI.reveal){if(canCloseFx())nextOverlay()}else render();return}
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  if(e.target.id==='bidAmt'){e.preventDefault();document.querySelector('[data-act="bid"]')?.click()}
  if(e.target.id==='rc')document.querySelector('[data-act="join"]')?.click();
  if(e.target.id==='chatIn'){e.preventDefault();sendChat(e.target.value);e.target.value='';e.target.blur()}
  if(e.target.id==='phNew'){e.preventDefault();document.querySelector('[data-act="ph-add"]')?.click()}
});
</script>
</body>
</html>
